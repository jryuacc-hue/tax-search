<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>志宇稅務記帳士事務所</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f6f9;
    display:flex;
    justify-content:center;
    align-items:center;
    min-height:100vh;
    margin:0;
}

.card{
    background:#fff;
    width:90%;
    max-width:420px;
    padding:30px;
    border-radius:12px;
    box-shadow:0 4px 15px rgba(0,0,0,.08);
}

h2{
    text-align:center;
    margin-bottom:25px;
}

label{
    display:block;
    margin-bottom:8px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px;
    border:1px solid #ccc;
    border-radius:6px;
    box-sizing:border-box;
    font-size:16px;
}

button{
    width:100%;
    margin-top:20px;
    background:#00B900;
    color:#fff;
    border:none;
    padding:12px;
    border-radius:6px;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    opacity:.9;
}

#status{
    text-align:center;
    margin-top:15px;
}

.success{
    color:green;
}

.error{
    color:red;
}

</style>

</head>
<body>

<div class="card">

<h2>客戶資料綁定</h2>

<label>統一編號</label>

<input
    type="text"
    id="taxId"
    maxlength="8"
    placeholder="請輸入8碼統一編號"
>

<button onclick="submitData()">
送出綁定
</button>

<div id="status"></div>

</div>

<script>

const LIFF_ID = "2010250428-wFlJYkBc";

const MAKE_WEBHOOK_URL =
"https://hook.us2.make.com/jz3zysq43uxb4tcf7j5xd2wl7l3k71bu";

let profileData = null;

async function initLiff(){

    try{

        await liff.init({
            liffId: LIFF_ID
        });

        if(!liff.isLoggedIn()){
            liff.login();
            return;
        }

        profileData = await liff.getProfile();

    }catch(err){

        console.error(err);

        document.getElementById("status").innerHTML =
        "<span class='error'>LIFF初始化失敗</span>";

    }

}

async function submitData(){

    const taxId =
    document.getElementById("taxId").value.trim();

    if(!/^[0-9]{8}$/.test(taxId)){

        alert("請輸入正確8碼統一編號");

        return;

    }

    try{

       const response = await fetch(
    MAKE_WEBHOOK_URL,
    {
        method: "POST",

        mode: "no-cors",

        headers: {
            "Content-Type": "text/plain;charset=UTF-8"
        },

        body: JSON.stringify({

            timestamp: new Date().toISOString(),

            lineName: profileData.displayName || "",

            userId: profileData.userId || "",

            pictureUrl: profileData.pictureUrl || "",

            taxId: taxId

        })
    }
);
        if(response.ok){

            document.getElementById("status").innerHTML =
            "<span class='success'>✓ 綁定成功</span>";

        }else{

            document.getElementById("status").innerHTML =
            "<span class='error'>綁定失敗</span>";

        }

    }catch(error){

        console.error(error);

        document.getElementById("status").innerHTML =
        "<span class='error'>系統錯誤</span>";

    }

}

initLiff();

</script>

</body>
</html>
