<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>志宇稅務記帳士事務所 - 客戶編號查詢</title>
    <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background-color: #f4f6f9; padding: 20px; display: flex; justify-content: center; align-items: center; height: 80vh; margin: 0; }
        .card { background: white; border-radius: 12px; padding: 30px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 400px; text-align: center; }
        h3 { color: #333; margin-bottom: 20px; }
        .id-box { background-color: #f0f0f0; border: 1px dashed #ccc; padding: 15px; border-radius: 6px; font-family: monospace; font-size: 14px; word-break: break-all; margin: 20px 0; color: #111; user-select: all; }
        .hint { font-size: 13px; color: #666; line-height: 1.5; }
        .loading { font-size: 16px; color: #00b900; font-weight: bold; }
    </style>
</head>
<body>

<div class="card">
    <h3>志宇稅務記帳士事務所</h3>
    <div id="status" class="loading">正在讀取您的客戶編號...</div>
    <div id="result-area" style="display: none;">
        <p class="hint">您的專屬 LINE User ID 如下：</p>
        <div id="user-id" class="id-box">讀取中...</div>
        <p class="hint">💡 提示：長按上方文字即可複製。未來辦理業務查詢時，請提供此編號給事務所，謝謝您！</p>
    </div>
</div>

<script>
    // 初始化 LIFF
    liff.init({ 
        liffId: '您的LIFF_ID' //https://liff.line.me/2010250428-wFlJYkBc
    }).then(() => {
        // 檢查使用者是否已登入 LINE
        if (liff.isLoggedIn()) {
            // 抓取用戶基本資料
            liff.getProfile().then(profile => {
                document.getElementById('status').style.display = 'none';
                document.getElementById('result-area').style.display = 'block';
                document.getElementById('user-id').innerText = profile.userId;
            }).catch(err => {
                document.getElementById('status').innerText = '讀取資料失敗，請重新整理。';
                console.error(err);
            });
        } else {
            // 若未登入，引導登入
            liff.login();
        }
    }).catch(err => {
        document.getElementById('status').innerText = '系統初始化失敗。';
        console.error(err);
    });
</script>

</body>
</html>
