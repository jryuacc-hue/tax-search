<!DOCTYPE html>
<html lang="zh-TW">

<head>

<meta charset="UTF-8">

<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<title>客戶資料綁定</title>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>

<style>

*{
    box-sizing:border-box;
}

body{

    margin:0;

    font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Noto Sans TC",
        Arial,
        sans-serif;

    background:#f4f6f9;

    min-height:100vh;

    display:flex;

    justify-content:center;

    align-items:center;

    padding:20px;

}

.card{

    width:100%;

    max-width:430px;

    background:#ffffff;

    padding:30px 25px;

    border-radius:16px;

    box-shadow:
        0 4px 20px rgba(0,0,0,0.08);

}

h1{

    text-align:center;

    font-size:30px;

    margin:5px 0 35px;

    color:#111;

}

label{

    display:block;

    font-size:20px;

    font-weight:bold;

    margin-bottom:10px;

}

input{

    width:100%;

    height:60px;

    padding:0 16px;

    font-size:20px;

    border:2px solid #cccccc;

    border-radius:10px;

    outline:none;

    background:#ffffff;

    color:#222;

}

input:focus{

    border-color:#00b900;

}

button{

    width:100%;

    height:60px;

    margin-top:25px;

    border:none;

    border-radius:10px;

    background:#00b900;

    color:white;

    font-size:21px;

    font-weight:bold;

    cursor:pointer;

}

button:disabled{

    background:#aaaaaa;

    cursor:not-allowed;

}

#status{

    margin-top:20px;

    text-align:center;

    font-size:17px;

    line-height:1.6;

}

.success{

    color:#008000;

}

.error{

    color:#d00000;

}

.info{

    color:#555555;

}

</style>

</head>


<body>


<div class="card">

    <h1>客戶資料綁定</h1>

    <label for="taxId">
        統一編號
    </label>

    <input

        type="text"

        id="taxId"

        inputmode="numeric"

        maxlength="8"

        placeholder="請輸入8碼統一編號"

        autocomplete="off"

    >

    <button
        id="submitBtn"
        onclick="submitData()"
        disabled
    >

        送出綁定

    </button>

    <div
        id="status"
        class="info"
    >

        正在取得 LINE 資料...

    </div>

</div>


<script>


/* ==========================================
   1. LIFF ID
========================================== */

const LIFF_ID = "2010250428-wFlJYkBc";


/* ==========================================
   2. Make Webhook
========================================== */

const MAKE_WEBHOOK_URL =
"https://hook.us2.make.com/jz3zysq43uxb4tcf7j5xd2wl7l3k71bu";


/* ==========================================
   3. LINE 資料
========================================== */

let profileData = null;


/* ==========================================
   4. DOM
========================================== */

const taxInput =
    document.getElementById("taxId");

const submitBtn =
    document.getElementById("submitBtn");

const statusBox =
    document.getElementById("status");


/* ==========================================
   5. 顯示訊息
========================================== */

function showStatus(message, type){

    statusBox.className = type || "info";

    statusBox.innerHTML = message;

}


/* ==========================================
   6. 初始化 LIFF
========================================== */

async function initLiff(){

    try{

        showStatus(
            "正在初始化 LINE...",
            "info"
        );


        await liff.init({

            liffId: LIFF_ID

        });


        console.log(
            "LIFF 初始化成功"
        );


        /*
         * 如果尚未登入 LINE
         */

        if(!liff.isLoggedIn()){

            showStatus(
                "正在登入 LINE...",
                "info"
            );


            /*
             * 使用 LINE Login
             */

            liff.login({

                redirectUri:
                    window.location.href

            });


            return;

        }


        /*
         * 已經登入
         * 取得 LINE Profile
         */

        showStatus(
            "正在取得 LINE 資料...",
            "info"
        );


        profileData =
            await liff.getProfile();


        console.log(
            "LINE Profile:",
            profileData
        );


        /*
         * 確認 User ID
         */

        if(
            !profileData ||
            !profileData.userId
        ){

            showStatus(
                "LINE User ID 尚未取得，請重新開啟。",
                "error"
            );

            submitBtn.disabled = true;

            return;

        }


        /*
         * 成功取得 LINE User ID
         */

        console.log(
            "LINE User ID:",
            profileData.userId
        );


        showStatus(
            "LIFF 初始化成功",
            "success"
        );


        /*
         * 開放按鈕
         */

        submitBtn.disabled = false;


        /*
         * 統一編號輸入框保持可輸入
         */

        taxInput.disabled = false;


    }

    catch(error){

        console.error(
            "LIFF Error:",
            error
        );


        showStatus(
            "LINE 初始化失敗<br>" +
            error.message,
            "error"
        );


        submitBtn.disabled = true;

    }

}


/* ==========================================
   7. 送出資料
========================================== */

async function submitData(){


    /*
     * 確認 LINE 資料
     */

    if(
        !profileData ||
        !profileData.userId
    ){

        showStatus(
            "LINE User ID 尚未取得，請重新開啟。",
            "error"
        );

        return;

    }


    /*
     * 取得統一編號
     */

    const taxId =
        taxInput.value.trim();


    /*
     * 檢查統一編號
     */

    if(
        !/^[0-9]{8}$/.test(taxId)
    ){

        showStatus(
            "請輸入正確的8碼統一編號。",
            "error"
        );

        taxInput.focus();

        return;

    }


    /*
     * 防止重複按
     */

    submitBtn.disabled = true;

    submitBtn.innerText =
        "資料送出中...";


    showStatus(
        "正在送出資料...",
        "info"
    );


    /*
     * 準備傳給 Make 的資料
     */

    const data = {

        timestamp:
            new Date().toISOString(),

        lineName:
            profileData.displayName || "",

        userId:
            profileData.userId || "",

        pictureUrl:
            profileData.pictureUrl || "",

        taxId:
            taxId

    };


    console.log(
        "送給 Make 的資料:",
        data
    );


    try{


        /*
         * 呼叫 Make Webhook
         */

        const response =
            await fetch(

                MAKE_WEBHOOK_URL,

                {

                    method:"POST",

                    headers:{

                        "Content-Type":
                            "application/json"

                    },

                    body:
                        JSON.stringify(data)

                }

            );


        console.log(
            "Make response:",
            response.status
        );


        /*
         * Make 成功
         */

        if(response.ok){

            showStatus(

                "✓ 客戶資料綁定成功",

                "success"

            );


            submitBtn.innerText =
                "綁定完成";


            /*
             * 清空統一編號
             */

            taxInput.value = "";


        }

        else{

            throw new Error(
                "Make Webhook 回應錯誤：" +
                response.status
            );

        }


    }

    catch(error){

        console.error(
            "送出錯誤:",
            error
        );


        showStatus(

            "系統錯誤<br>" +
            error.message,

            "error"

        );


        submitBtn.disabled = false;

        submitBtn.innerText =
            "重新送出";

    }

}


/* ==========================================
   8. 頁面載入
========================================== */

window.addEventListener(

    "load",

    function(){

        initLiff();

    }

);


</script>

</body>

</html>
